<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>supermarket</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1d1a16;
      background: #f3ecdf;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #5e584e44; }
    a { color: #2c5b4d; }
  </style>
</head>
<body>
  <h1>supermarket</h1>
  <p>Therapist page. Pick an intensity, then open the game export.</p>
  <table>
    <thead>
      <tr>
        <th>Level</th>
        <th>People</th>
        <th>Zones</th>
        <th>Checkout</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>0</td>
        <td>3 (Milk, Bread, Apples)</td>
        <td>Self checkout</td>
      </tr>
      <tr>
        <td>2</td>
        <td>10</td>
        <td>4 (+ Eggs)</td>
        <td>Self checkout</td>
      </tr>
      <tr>
        <td>3</td>
        <td>20</td>
        <td>5 (+ Rice)</td>
        <td>Cashier</td>
      </tr>
    </tbody>
  </table>
  <p><a href="http://127.0.0.1:8077/">Open game</a> (serve <code>build/web</code> on port 8077).</p>
</body>
</html>
